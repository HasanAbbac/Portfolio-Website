name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # Browser end-to-end tests (real Chrome on the runner, mail in dry-run mode). Kept non-blocking until it has run green on GitHub
      # a few times: it was only verified on Windows. Remove "continue-on-error" to make it a required check.
      - run: npm run test:e2e
        continue-on-error: true
